name: Build

# Every push / PR builds the firmware and keeps the .bin files as a workflow
# artifact. Pushing a tag like v1.2.0 also publishes a GitHub Release and the
# web flasher (GitHub Pages, Settings -> Pages -> Source: GitHub Actions).
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set firmware version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(cat version.txt | tr -d '[:space:]')-dev.${GITHUB_SHA::7}"
          fi
          echo "$VERSION" > version.txt
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building AxeForge $VERSION"

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          command: |
            idf.py build &&
            idf.py -B build_nerdaxe -D SDKCONFIG=build_nerdaxe/sdkconfig \
              -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.nerdaxe" build &&
            for b in build build_nerdaxe; do
              (cd $b && esptool.py --chip esp32s3 merge_bin -o axeforge-factory.bin \
                --flash_mode dio --flash_freq 80m --flash_size 16MB \
                0x0 bootloader/bootloader.bin \
                0x8000 partition_table/partition-table.bin \
                0x10000 axeforge.bin \
                0xc10000 ota_data_initial.bin) || exit 1
            done

      - name: Collect binaries
        run: |
          mkdir -p dist
          sudo cp build/axeforge-factory.bin dist/axeforge-factory.bin
          sudo cp build/axeforge.bin dist/axeforge.bin
          sudo cp build_nerdaxe/axeforge-factory.bin dist/axeforge-nerdaxe-factory.bin
          sudo cp build_nerdaxe/axeforge.bin dist/axeforge-nerdaxe.bin
          sudo chown -R "$(id -u):$(id -g)" dist
          cd dist && sha256sum *.bin > SHA256SUMS.txt && cat SHA256SUMS.txt

      # The flasher writes the pieces separately so the NVS area (Wi-Fi, pools)
      # is left alone; the merged factory image would blank it.
      - name: Stage web flasher
        run: |
          mkdir -p site
          cp flasher/* site/
          sudo cp build/bootloader/bootloader.bin build/partition_table/partition-table.bin \
                  build/ota_data_initial.bin build/axeforge.bin site/
          mkdir -p site/nerdaxe
          sudo cp build_nerdaxe/bootloader/bootloader.bin build_nerdaxe/partition_table/partition-table.bin \
                  build_nerdaxe/ota_data_initial.bin build_nerdaxe/axeforge.bin site/nerdaxe/
          sudo chown -R "$(id -u):$(id -g)" site
          sed -i "s/__VERSION__/${VERSION}/g" site/index.html site/manifest-*.json
          ls -la site

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: axeforge-${{ env.VERSION }}
          path: dist/*

      - name: Upload flasher for Pages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AxeForge ${{ env.VERSION }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/axeforge-factory.bin
            dist/axeforge.bin
            dist/axeforge-nerdaxe-factory.bin
            dist/axeforge-nerdaxe.bin
            dist/SHA256SUMS.txt
          # notes live in their own Markdown file so editing them can't break this YAML
          body_path: RELEASE_NOTES.md

  flasher:
    # pre-releases (tags with a dash) don't replace the public flasher
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
