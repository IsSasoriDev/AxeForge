openapi: 3.0.3
info:
  title: AxeForge miner API
  version: 1.4.9
  description: |
    The HTTP API every AxeForge miner serves at `http://<miner-ip>/api/...`. The web UI uses
    exactly these calls.

    **Rules for every request**
    - The `Host` header has to name the miner: an IP address or a LAN name (`.local`, `.lan`,
      a bare hostname and so on). Requests through a public domain name are refused (403).
    - Anything that is not a GET needs the header `X-AxeForge: 1`. If the browser sends `Origin`
      or `Sec-Fetch-Site`, they have to point at the miner itself.
    - With two-factor login on, every non-GET request (except `/api/otp`) also needs
      `X-AxeForge-Session: <token>` from `POST /api/otp`. Without it the answer is 401 with
      `{"login":true}`.
    - Every change is logged with the caller's address (see `/api/logs`).

    Example: `curl -X POST -H 'X-AxeForge: 1' --data-binary @axeforge-nerdaxe.bin http://192.168.1.50/api/ota`
servers:
  - url: http://{miner}
    variables:
      miner:
        default: 192.168.1.50
components:
  securitySchemes:
    csrf:
      type: apiKey
      in: header
      name: X-AxeForge
      description: Always "1" on requests that change something.
    session:
      type: apiKey
      in: header
      name: X-AxeForge-Session
      description: Only while two-factor login is on.
  schemas:
    Settings:
      type: object
      description: The settings GET returns and POST accepts. POST takes any subset.
      properties:
        ssid: {type: string}
        hostname: {type: string, description: empty means automatic; reboots}
        atune: {type: boolean, description: auto-tune on}
        freq: {type: integer, description: MHz, when auto-tune is off}
        mv: {type: integer, description: core mV, when auto-tune is off}
        tgoal: {type: integer, description: '0 hashrate, 1 power limit, 2 efficiency'}
        pcap: {type: number, description: 'W, 0 = board limit'}
        chiptune: {type: boolean, description: per-chip clock trimming}
        chipworkers: {type: boolean, description: 'Stratum V1: each chip submits under its own worker name'}
        otaguard: {type: boolean, description: roll back a new firmware that doesn't come up mining}
        autoupdate: {type: boolean, description: 'install a newer GitHub release by itself (checked every 6 h); off: the web UI offers it'}
        fantgt: {type: number, description: target chip temperature for the automatic fan, °C}
        fanmin: {type: integer, description: 'lowest automatic fan speed, %'}
        fmode0: {type: integer, description: fan 1 mode}
        fmode1: {type: integer, description: fan 2 mode}
        fman0: {type: integer, description: 'fan 1 manual speed, %'}
        fman1: {type: integer, description: 'fan 2 manual speed, %'}
        theme: {type: integer, description: '0 Forge, 1 Paper, 2 Ember, 3 Spatial; reboots'}
        tiles: {type: integer, description: 'dashboard cards: 0 bars, 1 gauges'}
        bright: {type: integer, description: 'screen brightness, %'}
        scroff: {type: integer}
        defpage: {type: integer, description: index into pages}
        rotate: {type: integer}
        rot180: {type: boolean}
        pages: {type: string, description: screen page order, one letter per page}
        disptype: {type: integer, description: '0 3.5" 480x320, 1 LilyGo T-Display-S3 320x170; reboots'}
        city: {type: string, description: for the weather}
        fahr: {type: boolean}
        h24: {type: boolean}
        mempool: {type: boolean}
        mpurl: {type: string, description: mempool server, e.g. https://mempool.space}
        paymode: {type: integer, description: 'payout check: 0 warn, 1 hold back work'}
        payfee: {type: integer, description: 'highest pool fee accepted, 0-100 %'}
        jobms: {type: integer, description: 'new job for the chips every N ms, 0 = default'}
        vrhz: {type: integer, description: 'version-rolling speed, Hz, 0 = default; BM1370 only'}
        tgchat: {type: string}
        notify: {type: integer, description: 'bits: 1 block, 2 best share, 4 faults, 8 no pool, 16 started'}
        bap: {type: boolean, description: the accessory port; reboots}
        blesetup: {type: boolean, description: Bluetooth Wi-Fi setup while in setup mode}
        priceon: {type: boolean, description: pause mining above a price}
        pricesrc: {type: integer, description: '0 Energy-Charts day-ahead price, 1 your own URL'}
        pricezone: {type: string, description: Energy-Charts bidding zone, e.g. DE-LU}
        pricepath: {type: string, description: dotted path to the price in the URL's JSON, e.g. data.0.price}
        pricemax: {type: number, description: 'ct/kWh for Energy-Charts, the URL''s own unit otherwise'}
        eprice: {type: number, description: 'per kWh in currency, 0 = market price'}
        currency: {type: string}
  responses:
    Text:
      description: A short, human-readable result ("Saved.", "Rebooting...")
      content:
        text/plain:
          schema: {type: string}
    LoginNeeded:
      description: Two-factor login is on and the session is missing or expired.
      content:
        application/json:
          schema:
            type: object
            properties:
              login: {type: boolean, example: true}
              error: {type: string}
security:
  - csrf: []
  - csrf: []
    session: []
paths:
  /api/status:
    get:
      summary: Everything the dashboard shows
      description: |
        Hashrate (GH/s), temperatures, power, fans (also in the AxeOS-style `fans` list), per-chip
        data, pools, the block template being mined and its payout check, mempool data, auto-tune
        state, weather, Ethernet state.
      security: []
      responses:
        '200':
          description: Live state
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [booting, no wifi, setup, connecting, mining, fault, overheat, paused]}
                  identify: {type: integer, description: 'seconds left on Find this miner, 0 when off'}
                  hashrate: {type: number, description: GH/s}
                  expected: {type: number, description: theoretical GH/s at the current clock}
                  errorPct: {type: number}
                  chipTemp: {type: number}
                  vrTemp: {type: number}
                  power: {type: number, description: W at the input}
                  vin: {type: number}
                  vout: {type: number}
                  freq: {type: number}
                  coreMv: {type: number}
                  version: {type: string}
                  hostname: {type: string}
                  ip: {type: string}
                  pmf: {type: boolean, description: 'the Wi-Fi link uses protected management frames (802.11w), which the miner always takes when the router offers them; left out when not on Wi-Fi'}
                  eth: {type: object, properties: {present: {type: boolean, description: a W5500 adapter answered at boot}, up: {type: boolean}, ip: {type: string}}}
                  weather: {type: object, properties: {valid: {type: boolean}, city: {type: string}, temp: {type: number}, code: {type: integer, description: WMO weather code}, text: {type: string}, isDay: {type: boolean}, feels: {type: number}, humidity: {type: integer}, wind: {type: number}, tmin: {type: number}, tmax: {type: number}, error: {type: string}, days: {type: array, description: today and the next two, items: {type: object, properties: {code: {type: integer}, tmin: {type: number}, tmax: {type: number}}}}}}
                  net: {type: object, description: ICMP ping to the pool in use, properties: {target: {type: string}, rttMs: {type: number}, lossPct: {type: number}}}
                  pools:
                    type: array
                    items:
                      type: object
                      properties:
                        host: {type: string}
                        connected: {type: boolean}
                        accepted: {type: integer}
                        rejected: {type: integer}
                        payout: {type: integer, description: '0 unknown, 1 username is not an address, 2 pays you, 3 does not'}
                        payoutPct: {type: integer}
                        payoutBlocked: {type: boolean, description: the payout check holds work back from this pool}
                        enabled: {type: boolean}
                        proto: {type: integer, description: '0 Stratum V1, 1 V1 + TLS, 2 Stratum V2'}
                        diff: {type: number, description: the pool's share difficulty}
                        best: {type: number, description: best share difficulty on this pool}
                        ghs: {type: number, description: hashrate this pool's shares account for}
                        workPct: {type: number, description: share of the work this pool gets, split mode}
                        jobs: {type: integer}
                        pingMs: {type: integer, description: 'share response: from sending a share to the pool''s answer'}
                        chipWorkers: {type: integer, description: chips submitting under their own worker name}
                        lagMs: {type: integer, description: how long after the first pool this pool announced the last new block}
                        lagBlocks: {type: integer}
                        lagFirst: {type: integer}
                        status: {type: string, description: what the connection is doing, in words}
                  chips:
                    type: array
                    items: {type: object, properties: {ghs: {type: number}, errGhs: {type: number}, temp: {type: number}, ownSensor: {type: boolean, description: the temperature is this chip's own sensor, not the board's}, mhz: {type: integer, description: this chip's clock, the board clock plus its per-chip offset}}}
                  tuner:
                    type: object
                    description: Auto-tune state. The wall and peak fields cover the current search only; a lock restored at boot has none.
                    properties:
                      phase: {type: string, enum: [manual, warmup, testing, stepping, locked, backoff]}
                      note: {type: string, description: what the tuner is doing, as on the Tuning page}
                      progress: {type: integer, description: 0-100 of the current window}
                      steps: {type: integer, description: windows measured in this search}
                      bestFreq: {type: integer, description: MHz of the best stable point, 0 while searching}
                      bestMv: {type: integer}
                      bestGhs: {type: number}
                      trialFreq: {type: integer, description: the point under test}
                      trialMv: {type: integer}
                      goal: {type: integer, description: '0 hashrate, 1 power limit, 2 efficiency'}
                      wall: {type: string, enum: ['', gate, mvgate, thermal, power, errors, hold, peak], description: 'what ended the climb: the clock limit, the voltage limit (errors that more voltage might have fixed), the temperature or power ceiling, hardware errors, a fault hold, the efficiency peak; empty before a wall is found, and after a restored lock'}
                      wallFreq: {type: integer, description: MHz of the point that failed, or the last stable one at the clock limit}
                      wallMv: {type: integer}
                      wallWatch: {type: boolean, description: the wall was found later by the watch phase (the lock failed), not by the climb}
                      peakW: {type: number, description: highest input power over this search's stable windows (failing steps don't count)}
                      peakChipC: {type: number, description: highest over every window, failing ones included}
                      peakVrC: {type: number}
                  fault: {type: string, description: the fault in words, empty when there is none}
                  purifier: {type: string, description: 'the panel fan mode; Bitair boards only'}
                  vrSensor: {type: boolean, description: the board has a voltage-regulator temperature sensor}
                  tempOk: {type: boolean, description: the chip and VR sensors both read}
                  board: {type: string, example: NerdQaxe++ rev5.1/6 (TPS53647)}
                  asicModel: {type: string, example: BM1370}
                  asicCount: {type: integer}
                  smallCores: {type: integer}
                  iout: {type: number, description: A at the regulator output}
                  fanPct: {type: number}
                  fanRpm: {type: number}
                  fan2Rpm: {type: number}
                  fans:
                    type: array
                    description: the same shape as the AxeOS / NerdQAxe list, so swarm tools can read it
                    items:
                      type: object
                      properties:
                        label: {type: string}
                        connected: {type: boolean}
                        rpm: {type: number}
                        speedPerc: {type: number}
                        mode: {type: integer}
                        manualSpeed: {type: integer}
                  fanCount: {type: integer}
                  uptime: {type: integer, description: seconds since boot}
                  resetReason: {type: string}
                  restartedBy: {type: string, description: who asked for the last restart, if it was asked for}
                  lastEmergency: {type: string}
                  emergencies: {type: integer}
                  screen: {type: string, enum: [big, tdisplay, oled]}
                  rssi: {type: integer, description: dBm, 0 when not on Wi-Fi}
                  ssid: {type: string}
                  worker: {type: string, description: the worker name this miner submits under}
                  otaPending: {type: boolean, description: a new firmware is on trial under the OTA guard}
                  update:
                    type: object
                    description: the self-update from GitHub releases
                    properties:
                      latest: {type: string, description: 'newest release tag, e.g. v1.4.9; empty until the first check'}
                      newer: {type: boolean, description: the latest release is newer than this firmware}
                      state: {type: string, enum: [idle, checking, downloading, failed]}
                      pct: {type: integer, description: 'download progress, %'}
                      msg: {type: string, description: the last result, for people}
                      auto: {type: boolean, description: auto-update is on}
                  psu:
                    type: object
                    description: the supply check
                    properties:
                      level: {type: string, enum: [ok, weak, bad, unknown]}
                      nominal: {type: number, description: V}
                      idle: {type: number, description: V with no load}
                      load: {type: number, description: V under load}
                      min: {type: number, description: lowest V seen}
                      watts: {type: number, description: W at the load reading}
                      sag: {type: number, description: '% below nominal'}
                      mohm: {type: number, description: estimated supply and cable resistance}
                  price:
                    type: object
                    description: the electricity price pause
                    properties:
                      'on': {type: boolean}
                      src: {type: integer, description: '0 Energy-Charts, 1 your own URL'}
                      now: {type: number, description: the price now; left out until one is known}
                      max: {type: number, description: mining pauses above this}
                      unit: {type: string, description: 'ct/kWh for Energy-Charts, empty for a URL'}
                      pausing: {type: boolean}
                      age: {type: integer, description: 'seconds since the last fetch, -1 before the first'}
                      error: {type: string}
                      step: {type: integer, description: seconds per slot}
                      start: {type: number, description: unix time of the first slot}
                      slots: {type: array, items: {type: number, nullable: true}}
                  dust:
                    type: object
                    description: the clean-heatsink reminder
                    properties:
                      state: {type: string, enum: [learning, ok, dirty]}
                      baseDays: {type: integer}
                      weekDays: {type: integer}
                      refW: {type: number}
                      baseTemp: {type: number}
                      baseFan: {type: number}
                      temp: {type: number}
                      fan: {type: number}
                      dTemp: {type: number}
                      dFan: {type: number}
                  overclocked: {type: boolean, description: an overclock envelope is in force}
                  energy:
                    type: object
                    description: the power bill and block odds
                    properties:
                      currency: {type: string}
                      priceFrom: {type: string}
                      price: {type: number, description: per kWh; left out until known}
                      kwhToday: {type: number}
                      kwhTotal: {type: number}
                      costToday: {type: number}
                      costTotal: {type: number}
                      since: {type: integer, description: unix time the totals start}
                      costPerDay: {type: number}
                      oddsDay: {type: number, description: chance of a block in a day, 0-1}
                      oddsMonth: {type: number}
                      oddsYear: {type: number}
                      yearsPerBlock: {type: number}
                      costPerBlock: {type: number}
                  freeHeap: {type: integer}
                  freeInternal: {type: integer}
                  freeDma: {type: integer, description: largest free DMA block}
                  chipsDetected: {type: integer}
                  bleSetup: {type: string, description: the Bluetooth setup name while in setup mode, else empty}
                  pool:
                    type: object
                    description: totals over all pools
                    properties:
                      connected: {type: boolean}
                      host: {type: string, description: the pool whose template is being mined}
                      diff: {type: number}
                      accepted: {type: integer}
                      rejected: {type: integer}
                      bestDiff: {type: number, description: best share ever, kept across reboots}
                      sessionBest: {type: number, description: best share since boot}
                      height: {type: integer}
                      networkDiff: {type: number}
                      blocks: {type: integer}
                      mode: {type: string, enum: [split, failover]}
                  template:
                    type: object
                    description: the block template being mined
                    properties:
                      valid: {type: boolean}
                      pool: {type: integer}
                      height: {type: integer}
                      prevHash: {type: string}
                      reward: {type: number, description: BTC}
                      branches: {type: integer, description: merkle branches}
                      tag: {type: string, description: the pool's coinbase tag}
                      scriptSig: {type: string}
                      ntime: {type: integer}
                      payout: {type: integer, description: '0 unknown, 1 username is not an address, 2 pays you, 3 does not'}
                      payoutAddr: {type: string}
                      payoutSats: {type: number}
                      totalSats: {type: number}
                      outputs:
                        type: array
                        items: {type: object, properties: {addr: {type: string}, sats: {type: number}, yours: {type: boolean}}}
                  lastHash: {type: string}
                  lastHashDiff: {type: number}
                  hashesChecked: {type: number}
                  dupResults: {type: integer}
                  mempool:
                    type: object
                    description: fees and blocks from the mempool server
                    properties:
                      valid: {type: boolean}
                      error: {type: string}
                      feeFast: {type: number, description: sat/vB}
                      feeHour: {type: number}
                      feeEco: {type: number}
                      mined:
                        type: array
                        items: {type: object, properties: {height: {type: integer}, txs: {type: integer}, size: {type: number, description: MB}, time: {type: integer}, fee: {type: number, description: median sat/vB}, fees: {type: number, description: BTC}, pool: {type: string}}}
                      next:
                        type: array
                        items: {type: object, properties: {txs: {type: integer}, vsize: {type: number, description: MvB}, fee: {type: number}, min: {type: number}, max: {type: number}}}
  /api/history:
    get:
      summary: The last hour, 120 points 30 s apart, oldest first (same shape as /api/stats)
      security: []
      responses:
        '200':
          description: Series, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  step: {type: integer, description: Seconds between points (30)}
                  hashrate: {type: array, items: {type: number}, description: GH/s}
                  temp: {type: array, items: {type: number}, description: Hottest ASIC, °C}
                  power: {type: array, items: {type: number}, description: Input power, W}
  /api/stats:
    get:
      summary: The last 24 hours, one point per 5 minutes, since boot
      security: []
      responses:
        '200':
          description: Series, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  step: {type: integer, example: 300}
                  hashrate: {type: array, items: {type: number}}
                  temp: {type: array, items: {type: number}}
                  power: {type: array, items: {type: number}}
  /api/scoreboard:
    get:
      summary: The 10 best shares, best first (kept across reboots)
      security: []
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    diff: {type: number}
                    time: {type: integer, description: unix time, 0 if the clock was not set}
                    uptime: {type: integer}
                    pool: {type: integer, description: 0-based}
                    chip: {type: integer, description: 0-based}
    post:
      summary: Clear the list and the best difficulty
      requestBody:
        content: {application/json: {schema: {type: object, properties: {reset: {type: boolean, example: true}}}}}
      responses:
        '200': {$ref: '#/components/responses/Text'}
        '401': {$ref: '#/components/responses/LoginNeeded'}
  /api/settings:
    get:
      summary: All settings plus the board's compiled-in limits
      description: The Discord webhook and the Telegram token are never returned; `discordSet` / `tgSet` say whether they are saved.
      security: []
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Settings'
                  - type: object
                    properties:
                      chipClock: {type: boolean, description: the chips take a clock of their own (per-chip trimming possible)}
                      priceurlSet: {type: boolean, description: a price URL is saved (it may hold a token, so it is never sent back)}
                      jobmsDefault: {type: integer, description: what jobms 0 means on this board}
                      vrSupported: {type: boolean, description: vrhz has an effect on this board}
                      discordSet: {type: boolean}
                      tgSet: {type: boolean}
                      hasBap: {type: boolean, description: the board has the accessory port}
                      hasEth: {type: boolean, description: the build drives a W5500 Ethernet adapter}
                      limits:
                        type: object
                        description: What the tuner and manual settings work within right now (the envelope while overclocking is active)
                        properties:
                          maxFreq: {type: integer, description: MHz}
                          minMv: {type: integer}
                          maxMv: {type: integer}
                          chipCeil: {type: number, description: tuner chip-temperature ceiling, °C}
                          chipCrit: {type: number, description: emergency chip-temperature cut, °C}
                          vrCeil: {type: number}
                          vrCrit: {type: number}
                          maxPower: {type: number, description: the tuner's power ceiling, W}
                      overclock:
                        type: object
                        properties:
                          available: {type: boolean, description: 'the board file has an [envelope] (never on a NerdQaxe++ rev7)'}
                          unlocked: {type: boolean, description: the user unlocked it}
                          active: {type: boolean, description: unlocked, and the power supply check is not weak or bad}
                          stockFreq: {type: integer}
                          stockMv: {type: integer}
                          stockPower: {type: number}
                          cutoffPower: {type: number, description: 'the power cut-off, 115 % of stock; never moves'}
                          boardId: {type: string, description: 'the board file, boards/<id>.toml'}
                          envFreq: {type: integer, description: 'MHz an unlock adds: the board file''s envelope, 0 where overclocking is not available'}
                          envMv: {type: integer}
                          envPowerPct: {type: integer, description: at most maxPowerPct}
                          maxPowerPct: {type: integer, description: 'the most an envelope may add to the stock power limit (10, below the 115 % cut-off)'}
    post:
      summary: Change any subset of settings
      description: |
        Send only the keys to change; the keys are in the request schema. A new goal, limit,
        `chiptune` or `overclock` starts a new tuner search.
        Wi-Fi, hostname, theme, screen type and the accessory port reboot the miner; the rest
        applies right away.
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Settings'
                - type: object
                  properties:
                    wpass: {type: string, description: Wi-Fi password; empty leaves it unchanged; reboots}
                    discord: {type: string, description: Discord webhook URL}
                    tgtoken: {type: string, description: Telegram bot token}
                    priceurl: {type: string, description: your own price URL (pricesrc 1)}
                    notifyClear: {type: boolean, description: clear the notification list}
                    overclock: {type: boolean, description: 'true needs confirm as well, and a board with overclock.available; false always works'}
                    confirm: {type: string, enum: [OVERCLOCK]}
            example: {freq: 600, mv: 1150, atune: false}
      responses:
        '200': {$ref: '#/components/responses/Text'}
        '401': {$ref: '#/components/responses/LoginNeeded'}
  /api/pools:
    get:
      summary: Pool list and mode
      security: []
      responses:
        '200':
          description: Up to 4 pools
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: {type: string, enum: [split, failover]}
                  pools:
                    type: array
                    items:
                      type: object
                      properties:
                        enabled: {type: boolean}
                        url: {type: string}
                        port: {type: integer}
                        user: {type: string}
                        pass: {type: string}
                        proto: {type: integer, description: '0 Stratum V1, 1 V1 + TLS, 2 Stratum V2'}
                        weight: {type: integer, description: percent of the work in split mode}
                        sv2key: {type: string}
    post:
      summary: Save pools and reconnect (no reboot)
      requestBody: {content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {$ref: '#/components/responses/Text'}
        '401': {$ref: '#/components/responses/LoginNeeded'}
  /api/wifi/scan:
    get:
      summary: Wi-Fi networks in range, strongest first (takes 2-3 s)
      security: []
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items: {type: object, properties: {ssid: {type: string}, rssi: {type: integer}, secure: {type: boolean}}}
  /api/selftest:
    get:
      summary: Self-test progress and results
      security: []
      responses:
        '200':
          description: Steps
          content:
            application/json:
              schema:
                type: object
                properties:
                  running: {type: boolean}
                  done: {type: boolean}
                  passed: {type: boolean}
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        state: {type: string, enum: [wait, run, pass, warn, fail]}
                        detail: {type: string}
    post:
      summary: Start a self-test (about a minute, mining keeps running)
      responses:
        '200': {$ref: '#/components/responses/Text'}
        '401': {$ref: '#/components/responses/LoginNeeded'}
  /api/notify:
    post:
      summary: Send a test message to the configured Discord / Telegram
      responses:
        '200': {$ref: '#/components/responses/Text'}
        '401': {$ref: '#/components/responses/LoginNeeded'}
  /api/otp:
    get:
      summary: Two-factor login state
      security: []
      responses:
        '200':
          description: State
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: {type: boolean}
                  session: {type: boolean, description: the X-AxeForge-Session sent is valid}
                  clock: {type: boolean, description: the miner has internet time, needed for codes}
    post:
      summary: Set up, log in, log out or turn off two-factor login
      description: |
        - `setup`: (when off) returns `secret`, `uri` (otpauth://) and `svg` (a QR code). Nothing changes yet.
        - `confirm` + `code`: turns it on and returns a session `token`.
        - `login` + `code`: returns a session `token`, valid for 12 hours or until a reboot.
        - `logout`: ends the session sent in the header.
        - `disable` + `code`: needs a valid session as well.

        Codes are 6-digit TOTP (30 s, SHA-1), each accepted once. Five wrong codes lock it for a minute.
      security:
        - csrf: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action: {type: string, enum: [setup, confirm, login, logout, disable]}
                code: {type: string, example: '123456'}
      responses:
        '200': {description: Result, content: {application/json: {schema: {type: object}}}}
        '400': {description: '{"error": "..."}'}
  /api/retune:
    post:
      summary: Start a new auto-tune search
      responses:
        '200': {$ref: '#/components/responses/Text'}
  /api/metrics:
    get:
      summary: Prometheus text format (hashrate, power, temperatures, fans, chips, pools)
      security: []
      responses:
        '200':
          description: Metrics
          content: {text/plain: {schema: {type: string}}}
  /api/dust:
    post:
      summary: The heatsink was cleaned; forget the baseline and learn again
      responses:
        '200': {$ref: '#/components/responses/Text'}
  /api/energy:
    post:
      summary: Reset the energy and cost totals
      responses:
        '200': {$ref: '#/components/responses/Text'}
  /api/ota/keep:
    post:
      summary: Keep the firmware that is on probation after an update (no rollback)
      responses:
        '200': {$ref: '#/components/responses/Text'}
  /api/restart:
    post:
      summary: Reboot the miner
      responses:
        '200': {$ref: '#/components/responses/Text'}
  /api/update:
    post:
      summary: Install the newest AxeForge release from GitHub, or check for one
      description: Body `check` asks GitHub now; anything else downloads and installs the newer release for this board, then restarts. Progress is in the status's `update` object.
      requestBody:
        required: false
        content: {text/plain: {schema: {type: string, example: check}}}
      responses:
        '200': {$ref: '#/components/responses/Text'}
        '400': {description: No newer release, or an update is already running}
  /api/identify:
    post:
      summary: Find this miner (blink its screen, or the Bitair's LED)
      description: Empty body blinks for 30 s; a number blinks that many seconds (at most 300); 0 stops.
      requestBody:
        required: false
        content: {text/plain: {schema: {type: string, example: '60'}}}
      responses:
        '200': {$ref: '#/components/responses/Text'}
  /api/ota:
    post:
      summary: Install a firmware update (the board's axeforge-<board>.bin, not the factory image)
      description: The raw .bin as the body. A file built for another board is refused (400).
      requestBody:
        content: {application/octet-stream: {schema: {type: string, format: binary}}}
      responses:
        '200': {$ref: '#/components/responses/Text'}
        '400': {description: Wrong board or not an app image}
  /api/logs:
    get:
      summary: Log lines since a position
      security: []
      parameters:
        - {name: since, in: query, schema: {type: integer}, description: '`next` from the previous call, 0 for everything kept'}
      responses:
        '200': {description: '{"next": n, "text": "..."}', content: {application/json: {schema: {type: object}}}}
  /api/screen.bmp:
    get:
      summary: The screen as it is now (16-bit BMP; LCD boards only)
      security: []
      responses:
        '200': {description: Image, content: {image/bmp: {}}}
  /api/page:
    post:
      summary: 'Change the page on the screen: {"dir":1|-1} or {"kind":"d"}'
      responses:
        '200': {description: '{"kind": "d"}'}
  /api/layout:
    get:
      summary: The two custom screen layouts
      security: []
      responses:
        '200': {description: Layouts, content: {application/json: {schema: {type: object}}}}
    post:
      summary: Save the custom layouts
      responses:
        '200': {$ref: '#/components/responses/Text'}
  /api/swarm:
    get:
      summary: This miner and the others it knows on the network
      security: []
      responses:
        '200':
          description: Swarm
          content:
            application/json:
              schema:
                type: object
                properties:
                  scanning: {type: boolean, description: a network scan is running}
                  miners:
                    type: array
                    description: this miner first, then the peers
                    items:
                      type: object
                      properties:
                        ip: {type: string}
                        name: {type: string, description: '"this miner" for the first entry'}
                        worker: {type: string}
                        kind: {type: string, example: AxeForge}
                        model: {type: string}
                        version: {type: string}
                        online: {type: boolean}
                        self: {type: boolean}
                        hashrate: {type: number, description: GH/s}
                        temp: {type: number, description: hottest chip, °C}
                        power: {type: number, description: W}
                        uptime: {type: integer, description: seconds}
                        best: {type: number}
                        accepted: {type: integer}
                        rejected: {type: integer}
                        ago: {type: integer, description: 'seconds since it last answered; 0 while online, -1 if not seen since this miner booted'}
    post:
      summary: '{"add":"192.168.1.20"}, {"remove":"192.168.1.20"} or {"scan":true}'
      responses:
        '200': {$ref: '#/components/responses/Text'}
